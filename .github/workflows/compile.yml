name: Compile robot modes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.2.2"
      - name: Install target and library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli lib install Servo@1.2.2
      - name: Compile each independent Sketch
        shell: bash
        run: |
          set -euo pipefail
          for sketch in firmware/*; do
            arduino-cli compile --fqbn arduino:avr:uno "$sketch"
          done
